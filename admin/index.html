<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zettly Admin</title>
<style>
  :root {
    --accent: #7C3AED;
    --accent-light: #F3EEFF;
    --pink: #EC4899;
    --ink: #111114;
    --muted: #6b6b74;
    --border: #e9e7ef;
    --bg: #f7f6fb;
    --ok: #16a34a;
    --ok-bg: #eafcef;
    --danger: #c2185b;
    --danger-bg: #fdeef2;
    --warn: #b45309;
    --warn-bg: #fef3e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  a { color: inherit; }

  /* ---- Login screen ---- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem 1.75rem;
    box-shadow: 0 10px 30px rgba(17,17,20,0.06);
  }
  .brand-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; }
  .brand-mark-sm { width: 30px; height: 30px; flex: 0 0 auto; }
  .brand-text-sm { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 300; font-size: 1.4rem; letter-spacing: 0.01em; }
  .brand-text-sm span { color: var(--accent); }
  .login-card h1 { font-size: 1.05rem; font-weight: 700; margin: 0 0 1.25rem; color: var(--muted); }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 0.4rem; }
  .field input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .error-msg { color: var(--danger); font-size: 0.82rem; margin: 0.7rem 0 0; min-height: 1.1em; }

  /* ---- Dashboard ---- */
  #dashboard { display: none; }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.82rem; }
  main { padding: 1.5rem; max-width: 1180px; margin: 0 auto; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1.1rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem;
  }
  .filters input, .filters select {
    padding: 0.55rem 0.7rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .filters input[type="search"] { flex: 1 1 200px; min-width: 160px; }

  .table-wrap { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fbfaff; cursor: pointer; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 999px; text-transform: capitalize; }
  .badge-confirmed { background: var(--ok-bg); color: var(--ok); }
  .badge-cancelled { background: var(--danger-bg); color: var(--danger); }
  .badge-completed { background: var(--accent-light); color: var(--accent); }
  .ref { font-weight: 700; }
  .muted { color: var(--muted); }
  .empty-state { padding: 3rem 1rem; text-align: center; color: var(--muted); }
  .pager { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1rem; font-size: 0.82rem; color: var(--muted); }
  .pager button { padding: 0.4rem 0.8rem; }

  /* ---- Detail modal ---- */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(17,17,20,0.4);
    align-items: center; justify-content: center;
    padding: 1rem;
    z-index: 20;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    max-width: 460px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.5rem;
  }
  .modal h2 { font-size: 1.05rem; margin: 0 0 0.3rem; }
  .modal .modal-ref { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.1rem; }
  .detail-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-top: 1px solid var(--border); font-size: 0.85rem; }
  .detail-row:first-of-type { border-top: none; }
  .detail-row dt { color: var(--muted); }
  .detail-row dd { margin: 0; font-weight: 600; text-align: right; }
  .modal-actions { display: flex; gap: 0.6rem; margin-top: 1.3rem; flex-wrap: wrap; }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-ok { background: var(--ok-bg); color: var(--ok); }
  .btn-neutral { background: var(--accent-light); color: var(--accent); }
  .modal-close { background: none; border: none; float: right; font-size: 1.3rem; line-height: 1; cursor: pointer; color: var(--muted); }
  .toast {
    position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 0.7rem 1.1rem; border-radius: 10px;
    font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 30;
  }
  .toast.show { opacity: 1; }

  /* ---- Confirm dialog (replaces window.confirm) ---- */
  .confirm-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(17,17,20,0.45);
    align-items: center; justify-content: center;
    padding: 1rem;
    z-index: 40;
  }
  .confirm-backdrop.open { display: flex; }
  .confirm-dialog {
    background: #fff;
    border-radius: 16px;
    max-width: 400px;
    width: 100%;
    padding: 1.5rem;
    box-shadow: 0 20px 50px rgba(17,17,20,0.18);
    animation: confirm-pop 0.15s ease-out;
  }
  @keyframes confirm-pop {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .confirm-dialog h3 { margin: 0 0 0.5rem; font-size: 1.02rem; }
  .confirm-dialog p.confirm-msg { margin: 0 0 0.9rem; font-size: 0.86rem; color: var(--muted); line-height: 1.5; }
  .confirm-dialog .field { margin-bottom: 0.3rem; }
  .confirm-dialog .field label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--muted); margin-bottom: 0.35rem; }
  .confirm-dialog textarea {
    width: 100%;
    min-height: 72px;
    padding: 0.6rem 0.75rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.86rem;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  .confirm-dialog textarea:focus { border-color: var(--accent); }
  .confirm-dialog .field-error { color: var(--danger); font-size: 0.76rem; margin: 0.35rem 0 0; min-height: 1.05em; }
  .confirm-actions { display: flex; gap: 0.6rem; margin-top: 1.1rem; }
  .confirm-actions .btn { flex: 1; }
  .btn-cancel-action { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="login-screen">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="brand-row">
      <svg class="brand-mark-sm" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#7C3AED"/>
        <rect x="36" y="0" width="64" height="64" rx="14" fill="#111114"/>
        <rect x="0" y="36" width="64" height="64" rx="14" fill="#7C3AED"/>
        <rect x="72" y="72" width="28" height="28" rx="6" fill="#111114"/>
      </svg>
      <span class="brand-text-sm">zett<span>ly</span></span>
    </div>
    <h1>Admin-Login</h1>
    <div class="field">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="login-btn">Anmelden</button>
    <p class="error-msg" id="login-error"></p>
  </form>
</div>

<div id="dashboard">
  <header class="topbar">
    <span class="brand-text-sm">zett<span>ly</span> <span class="muted" style="font-size:0.8rem; font-weight:400;">Admin</span></span>
    <button class="btn btn-ghost" id="logout-btn">Abmelden</button>
  </header>
  <main>
    <div class="filters">
      <input type="search" id="f-q" placeholder="Suche: Name, E-Mail, Buchungs-ID …">
      <select id="f-status">
        <option value="">Alle Status</option>
        <option value="confirmed">Bestätigt</option>
        <option value="cancelled">Storniert</option>
        <option value="completed">Abgeschlossen</option>
      </select>
      <input type="date" id="f-from" title="Von Datum">
      <input type="date" id="f-to" title="Bis Datum">
      <button class="btn btn-ghost" id="f-clear">Zurücksetzen</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Referenz</th>
            <th>Kunde</th>
            <th>Leistung</th>
            <th>Termin</th>
            <th>Preis</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty-state" id="empty" style="display:none;">Keine Buchungen gefunden.</div>
      <div class="pager">
        <span id="pager-info"></span>
        <div>
          <button class="btn btn-ghost" id="prev-btn">← Zurück</button>
          <button class="btn btn-ghost" id="next-btn">Weiter →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <h2 id="m-name"></h2>
    <div class="modal-ref" id="m-ref"></div>
    <dl>
      <div class="detail-row"><dt>Status</dt><dd id="m-status"></dd></div>
      <div class="detail-row"><dt>Leistung</dt><dd id="m-service"></dd></div>
      <div class="detail-row"><dt>Termin</dt><dd id="m-when"></dd></div>
      <div class="detail-row"><dt>Dauer</dt><dd id="m-duration"></dd></div>
      <div class="detail-row"><dt>Preis</dt><dd id="m-price"></dd></div>
      <div class="detail-row"><dt>E-Mail</dt><dd id="m-email"></dd></div>
      <div class="detail-row"><dt>Telefon</dt><dd id="m-phone"></dd></div>
      <div class="detail-row"><dt>Adresse</dt><dd id="m-address"></dd></div>
      <div class="detail-row" id="m-notes-row"><dt>Notizen</dt><dd id="m-notes"></dd></div>
      <div class="detail-row" id="m-cancel-reason-row"><dt>Stornierungsgrund</dt><dd id="m-cancel-reason"></dd></div>
      <div class="detail-row"><dt>Erstellt</dt><dd id="m-created"></dd></div>
    </dl>
    <div class="modal-actions" id="m-actions"></div>
  </div>
</div>

<div class="confirm-backdrop" id="confirm-modal">
  <div class="confirm-dialog">
    <h3 id="confirm-title"></h3>
    <p class="confirm-msg" id="confirm-message"></p>
    <div class="field" id="confirm-reason-field">
      <label for="confirm-reason">Grund der Stornierung (erforderlich)</label>
      <textarea id="confirm-reason" placeholder="Bitte Grund angeben…"></textarea>
      <p class="field-error" id="confirm-reason-error"></p>
    </div>
    <div class="confirm-actions">
      <button class="btn btn-cancel-action" id="confirm-cancel-btn">Abbrechen</button>
      <button class="btn btn-danger" id="confirm-ok-btn">Bestätigen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const loginScreen = document.getElementById("login-screen");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("login-form");
  const loginError = document.getElementById("login-error");
  const loginBtn = document.getElementById("login-btn");

  let state = { offset: 0, limit: 20, total: 0 };

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2200);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { "content-type": "application/json", "X-Admin-Request": "1", ...(opts.headers || {}) },
      credentials: "same-origin",
    });
    if (res.status === 401) {
      showLogin();
      throw new Error("unauthenticated");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Fehler");
    return data;
  }

  function showLogin() {
    loginScreen.style.display = "flex";
    dashboard.style.display = "none";
  }
  function showDashboard() {
    loginScreen.style.display = "none";
    dashboard.style.display = "block";
    loadBookings();
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.textContent = "";
    loginBtn.disabled = true;
    const password = document.getElementById("password").value;
    try {
      await api("/api/admin/login", { method: "POST", body: JSON.stringify({ password }) });
      document.getElementById("password").value = "";
      showDashboard();
    } catch (err) {
      loginError.textContent = err.message === "unauthenticated" ? "" : (err.message || "Anmeldung fehlgeschlagen");
    } finally {
      loginBtn.disabled = false;
    }
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await api("/api/admin/logout", { method: "POST" }).catch(() => {});
    showLogin();
  });

  const statusLabel = { confirmed: "Bestätigt", cancelled: "Storniert", completed: "Abgeschlossen" };

  function buildQuery() {
    const params = new URLSearchParams();
    const q = document.getElementById("f-q").value.trim();
    const status = document.getElementById("f-status").value;
    const from = document.getElementById("f-from").value;
    const to = document.getElementById("f-to").value;
    if (q) params.set("q", q);
    if (status) params.set("status", status);
    if (from) params.set("from", from);
    if (to) params.set("to", to);
    params.set("limit", state.limit);
    params.set("offset", state.offset);
    return params.toString();
  }

  async function loadBookings() {
    const data = await api("/api/admin/bookings?" + buildQuery());
    state.total = data.total;
    renderRows(data.bookings);
    renderPager();
  }

  function renderRows(bookings) {
    const tbody = document.getElementById("rows");
    const empty = document.getElementById("empty");
    tbody.innerHTML = "";
    if (!bookings.length) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    for (const b of bookings) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="ref">${b.bookingRef}</td>
        <td>${escapeHtml(b.customer_name)}<div class="muted">${escapeHtml(b.customer_email)}</div></td>
        <td>${escapeHtml(b.service_name)}</td>
        <td>${b.date}<div class="muted">${b.time} Uhr</div></td>
        <td>${b.price ? "€" + b.price : "Vor Ort"}</td>
        <td><span class="badge badge-${b.status}">${statusLabel[b.status] || b.status}</span></td>
      `;
      tr.addEventListener("click", () => openDetail(b.id));
      tbody.appendChild(tr);
    }
  }

  function renderPager() {
    const from = state.total === 0 ? 0 : state.offset + 1;
    const to = Math.min(state.offset + state.limit, state.total);
    document.getElementById("pager-info").textContent = `${from}–${to} von ${state.total}`;
    document.getElementById("prev-btn").disabled = state.offset === 0;
    document.getElementById("next-btn").disabled = to >= state.total;
  }

  document.getElementById("prev-btn").addEventListener("click", () => {
    state.offset = Math.max(0, state.offset - state.limit);
    loadBookings();
  });
  document.getElementById("next-btn").addEventListener("click", () => {
    state.offset += state.limit;
    loadBookings();
  });
  ["f-q", "f-status", "f-from", "f-to"].forEach((id) => {
    document.getElementById(id).addEventListener("change", () => { state.offset = 0; loadBookings(); });
  });
  document.getElementById("f-q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); state.offset = 0; loadBookings(); }
  });
  document.getElementById("f-clear").addEventListener("click", () => {
    document.getElementById("f-q").value = "";
    document.getElementById("f-status").value = "";
    document.getElementById("f-from").value = "";
    document.getElementById("f-to").value = "";
    state.offset = 0;
    loadBookings();
  });

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let currentDetail = null;

  async function openDetail(id) {
    const b = await api("/api/admin/bookings/" + encodeURIComponent(id));
    currentDetail = b;
    document.getElementById("m-name").textContent = b.customer_name;
    document.getElementById("m-ref").textContent = b.bookingRef;
    document.getElementById("m-status").innerHTML = `<span class="badge badge-${b.status}">${statusLabel[b.status] || b.status}</span>`;
    document.getElementById("m-service").textContent = b.service_name;
    document.getElementById("m-when").textContent = `${b.date}, ${b.time} Uhr`;
    document.getElementById("m-duration").textContent = `${b.duration_minutes} Min.`;
    document.getElementById("m-price").textContent = b.price ? "€" + b.price : "Vor Ort mitgeteilt";
    document.getElementById("m-email").textContent = b.customer_email;
    document.getElementById("m-phone").textContent = b.customer_phone || "—";
    document.getElementById("m-address").textContent = b.customer_address || "—";
    const notesRow = document.getElementById("m-notes-row");
    if (b.notes) { notesRow.style.display = "flex"; document.getElementById("m-notes").textContent = b.notes; }
    else notesRow.style.display = "none";
    const cancelReasonRow = document.getElementById("m-cancel-reason-row");
    if (b.cancellation_reason) { cancelReasonRow.style.display = "flex"; document.getElementById("m-cancel-reason").textContent = b.cancellation_reason; }
    else cancelReasonRow.style.display = "none";
    document.getElementById("m-created").textContent = b.created_at;

    const actions = document.getElementById("m-actions");
    actions.innerHTML = "";
    if (b.status !== "cancelled") {
      actions.appendChild(makeActionBtn("Stornieren", "btn-danger", () => updateStatus(b.id, "cancelled")));
    }
    if (b.status !== "completed" && b.status !== "cancelled") {
      actions.appendChild(makeActionBtn("Als abgeschlossen markieren", "btn-ok", () => updateStatus(b.id, "completed")));
    }
    if (b.status !== "confirmed") {
      actions.appendChild(makeActionBtn("Wieder bestätigen", "btn-neutral", () => updateStatus(b.id, "confirmed")));
    }
    document.getElementById("modal").classList.add("open");
  }

  function makeActionBtn(label, cls, onClick) {
    const btn = document.createElement("button");
    btn.className = "btn " + cls;
    btn.textContent = label;
    btn.addEventListener("click", onClick);
    return btn;
  }

  // ---- Custom confirm dialog (replaces window.confirm/alert) ------------
  function showConfirm({ title, message, requireReason }) {
    return new Promise((resolve) => {
      const backdrop = document.getElementById("confirm-modal");
      const reasonField = document.getElementById("confirm-reason-field");
      const reasonInput = document.getElementById("confirm-reason");
      const reasonError = document.getElementById("confirm-reason-error");
      document.getElementById("confirm-title").textContent = title;
      document.getElementById("confirm-message").textContent = message;
      reasonInput.value = "";
      reasonError.textContent = "";
      reasonField.style.display = requireReason ? "block" : "none";

      const okBtn = document.getElementById("confirm-ok-btn");
      const cancelBtn = document.getElementById("confirm-cancel-btn");

      function cleanup(result) {
        backdrop.classList.remove("open");
        okBtn.removeEventListener("click", onOk);
        cancelBtn.removeEventListener("click", onCancel);
        backdrop.removeEventListener("click", onBackdropClick);
        document.removeEventListener("keydown", onKeydown);
        resolve(result);
      }
      function onOk() {
        if (requireReason) {
          const reason = reasonInput.value.trim();
          if (!reason) {
            reasonError.textContent = "Bitte geben Sie einen Grund an.";
            reasonInput.focus();
            return;
          }
          cleanup({ confirmed: true, reason });
        } else {
          cleanup({ confirmed: true });
        }
      }
      function onCancel() { cleanup({ confirmed: false }); }
      function onBackdropClick(e) { if (e.target === backdrop) onCancel(); }
      function onKeydown(e) { if (e.key === "Escape") onCancel(); }

      okBtn.addEventListener("click", onOk);
      cancelBtn.addEventListener("click", onCancel);
      backdrop.addEventListener("click", onBackdropClick);
      document.addEventListener("keydown", onKeydown);

      backdrop.classList.add("open");
      if (requireReason) setTimeout(() => reasonInput.focus(), 30);
    });
  }

  async function updateStatus(id, status) {
    let reason;
    if (status === "cancelled") {
      const result = await showConfirm({
        title: "Buchung stornieren",
        message: "Diese Buchung wirklich stornieren? Der Kunde wird per E-Mail benachrichtigt.",
        requireReason: true,
      });
      if (!result.confirmed) return;
      reason = result.reason;
    }
    try {
      await api(`/api/admin/bookings/${encodeURIComponent(id)}/status`, {
        method: "POST",
        body: JSON.stringify({ status, ...(reason ? { reason } : {}) }),
      });
      toast("Status aktualisiert");
      closeModal();
      loadBookings();
    } catch (err) {
      toast(err.message || "Fehler beim Aktualisieren");
    }
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("open");
    currentDetail = null;
  }
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("click", (e) => {
    if (e.target.id === "modal") closeModal();
  });

  // ---- Boot: check for an existing session ----
  (async function boot() {
    try {
      const res = await fetch("/api/admin/me", { credentials: "same-origin" });
      const data = await res.json();
      if (data.authenticated) showDashboard();
      else showLogin();
    } catch {
      showLogin();
    }
  })();
})();
</script>
</body>
</html>
