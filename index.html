<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zettly | Demnächst verfügbar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts/plus-jakarta-sans.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #7C3AED;
    --ink: #111114;
    --muted: #6b6b74;
    --border: #e9e7ef;
  }

  :root:not([data-theme="light"]) {
    color-scheme: light;
  }

  body {
    background: #ffffff;
    color: var(--ink);
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    text-align: center;
    overflow-x: hidden;
  }

  .brand { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; margin-bottom: 2.5rem; }
  .brand-mark { width: 52px; height: 52px; flex: 0 0 auto; }
  .brand-mark .m1 { animation: markPulse 3s ease-in-out infinite 0s; }
  .brand-mark .m2 { animation: markPulse 3s ease-in-out infinite 0.35s; }
  .brand-mark .m3 { animation: markPulse 3s ease-in-out infinite 0.7s; }
  .brand-mark .m4 { animation: markPulse 3s ease-in-out infinite 1.05s; }
  @keyframes markPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  .brand-text {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 2.2rem;
    font-weight: 200;
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1;
  }
  .brand-text span { color: var(--accent); }

  .badge {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: #F3EEFF;
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-size: clamp(1.9rem, 6vw, 2.8rem);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }

  .sub {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.55;
    max-width: 30rem;
    margin: 0 auto 2rem;
  }
  .sub.en { font-size: 0.95rem; margin-top: -1.25rem; margin-bottom: 2rem; }

  .contact {
    display: inline-block;
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 0.15rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f4f4f7; --muted: #a3a3ad; --border: #2a2a33; }
    :root:not([data-theme="light"]) body { background: #111114; }
  }
  :root[data-theme="dark"] { --ink: #f4f4f7; --muted: #a3a3ad; --border: #2a2a33; }
  :root[data-theme="dark"] body { background: #111114; }
</style>
</head>
<body>
  <a class="brand" href="/" aria-label="zettly">
    <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect class="m1" x="0"  y="0"  width="28" height="28" rx="6"  fill="#7C3AED"/>
      <rect class="m2" x="36" y="0"  width="64" height="64" rx="14" fill="#111114"/>
      <rect class="m3" x="0"  y="36" width="64" height="64" rx="14" fill="#7C3AED"/>
      <rect class="m4" x="72" y="72" width="28" height="28" rx="6"  fill="#111114"/>
    </svg>
    <span class="brand-text">zett<span>ly</span></span>
  </a>

  <span class="badge">Coming soon</span>
  <h1>Demnächst verfügbar</h1>
  <p class="sub">Wir arbeiten gerade an unserer neuen Website. Bis dahin erreichen Sie uns jederzeit per E-Mail.</p>
  <p class="sub en">We are working on our new website. Until then, you can reach us anytime by email.</p>
  <a class="contact" href="mailto:kontakt@zettly.de">kontakt@zettly.de</a>
</body>
</html>
