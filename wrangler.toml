name = "zettly"
main = "src/index.js"
compatibility_date = "2024-09-25"

[assets]
directory = "./"
binding = "ASSETS"

# Create the DB with: wrangler d1 create zettly-db
# Then paste its database_id below, and run:
#   wrangler d1 execute zettly-db --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "zettly-db"
database_id = "196c9e0f-2ae9-4bfb-858d-0870dfc8e663"

[vars]
# Verified sending domain on Resend. Update here (not a secret — it's not
# sensitive) if the "from" address ever changes.
RESEND_FROM = "Zettly <no-reply@zettly.de>"

# ---- Admin area (src/admin.js, admin/index.html) ----
# Both are secrets, never plain [vars] — set them once with:
#   node scripts/hash-admin-password.mjs "your-new-admin-password"
#   wrangler secret put ADMIN_PASSWORD_HASH     (paste the printed value)
#   wrangler secret put SESSION_SECRET          (paste output of: openssl rand -hex 32)
# Without these two secrets, /admin returns "Admin login is not configured yet".
